name: Pipeline de Aseguramiento de Calidad y Verificación de Software

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Inicializar Entorno de Ejecución Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Instalación de Librerías y Dependencias Críticas
      run: pip install pytest pytest-cov flask


      
    - name: Corrida Completa de Pruebas Unitarias e Integración
      run: pytest --cov=. test_app.py --cov-report=term-missing
