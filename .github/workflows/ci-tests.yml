name: Tubería de Pruebas Automatizadas (CI)

on:
  push:
    branches: [ main, principal ]
  pull_request:
    branches: [ main, principal ]

jobs:
  testeo-calidad:
    runs-on: ubuntu-latest
    steps:
    - name: Descargar Código de GitHub
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install flask pytest pytest-cov

    - name: Ejecutar Pruebas y Análisis de Cobertura
      run: |
        pytest --cov=. test_app.py --cov-report=term-missing
